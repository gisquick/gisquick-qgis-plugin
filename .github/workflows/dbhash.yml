name: Build dbhash macOS ARM

on:
  push:
    branches: [main]

jobs:
  build-macos-arm:
    runs-on: macos-14

    steps:
      - name: Download SQLite source
        run: |
          wget https://www.sqlite.org/2024/sqlite-amalgamation-3460000.zip
          wget https://www.sqlite.org/2024/sqlite-src-3460000.zip
          unzip sqlite-amalgamation-3460000.zip
          unzip sqlite-src-3460000.zip

      - name: Compile dbhash
        run: |
          gcc -O2 -DSQLITE_THREADSAFE=0 -DSQLITE_OMIT_LOAD_EXTENSION sqlite-src-3460000/tool/dbhash.c sqlite-amalgamation-3460000/sqlite3.c -lm -o dbhash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbhash-macos-arm
          path: sqlite-amalgamation-3460000/dbhash
